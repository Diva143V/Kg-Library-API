[tool.poetry]
name = "kg-library-api"
version = "0.1.0"
description = ""
authors = ["Diva"]
readme = "README.md"

packages = [
    { include = "kg_library_api" }
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
sqlalchemy = "^2.0.35"
psycopg2-binary = "^2.9.9"
psycopg = {extras = ["binary"], version = "^3.2.12"}
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
black = "^23.9.1"
mypy = "^1.5.1"
isort = "^5.12.0"
pytest = "^8.2.2"
pytest-dotenv = "^0.5.2"
pylint = "^3.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.pylint]
max-line-length = 120

